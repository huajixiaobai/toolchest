<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<title>Balatro 素材图鉴 · 全美术资源查看与提取器（在线版）</title>
<meta name="description" content="Balatro 全美术素材离线查看 / 预览 / 提取器：小丑牌、塔罗、星球、幽灵、优惠券、补充包、盲注、强化、蜡封、版本特效与全部游戏数据。">
<meta name="theme-color" content="#10161c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#10161c; --bg2:#151d25; --bg3:#1b242e; --line:#26313d; --line2:#33414f;
  --fg:#dfe7ee; --fg2:#9fb0c0; --fg3:#6d7d8d;
  --accent:#4bc292; --accent2:#009dff; --red:#fe5f55; --money:#f3b958; --purple:#a782d1;
  --blue:#009dff; --green:#4bc292; --orange:#ff9a00;
  --radius:8px;
  --mono:"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;
  --sans:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:
    radial-gradient(1200px 600px at 15% -10%, #1d3040 0%, transparent 60%),
    radial-gradient(900px 500px at 100% 0%, #241c33 0%, transparent 55%),
    var(--bg);
  color:var(--fg); font-family:var(--sans); font-size:13.5px; line-height:1.5;
  overflow:hidden;
}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2c3844;border-radius:6px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#3d4b59;background-clip:content-box}

#shell{display:flex;flex-direction:column;height:100vh;height:100dvh}

/* ---------- mobile chrome ---------- */
#backdrop{
  position:fixed;inset:0;background:#000b;opacity:0;pointer-events:none;transition:opacity .22s;z-index:55
}
body.nav-open #backdrop,body.detail-open #backdrop{opacity:1;pointer-events:auto}
#navToggle{display:none;align-items:center;justify-content:center;width:38px;height:34px;font-size:17px;flex:0 0 auto}
#detailClose{display:none;position:absolute;top:8px;right:8px;z-index:8;width:34px;height:34px;padding:0;
  align-items:center;justify-content:center;font-size:16px;border-radius:50%}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tablewrap table.data{min-width:640px}
button,.pick,.cat,.cell{touch-action:manipulation}
button,input,select{-webkit-tap-highlight-color:transparent}

/* ---------- top bar ---------- */
#topbar{
  display:flex;align-items:center;gap:12px;padding:8px 14px;flex:0 0 auto;
  background:linear-gradient(180deg,#18222c,#131b23);border-bottom:1px solid var(--line);
  box-shadow:0 2px 12px #0006; z-index:20; flex-wrap:wrap;
}
#logo{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.4px;white-space:nowrap}
#logo b{color:var(--accent);font-size:15px}
#logo span{color:var(--fg3);font-size:11px;font-weight:400}
#searchWrap{flex:1 1 320px;min-width:220px;position:relative;display:flex;align-items:center}
#search{
  width:100%;padding:8px 30px 8px 30px;border-radius:20px;border:1px solid var(--line2);
  background:#0d1319;outline:none;transition:.15s;
}
#search:focus{border-color:var(--accent);box-shadow:0 0 0 3px #4bc29222}
#searchWrap .ico{position:absolute;left:9px;opacity:.5;font-size:13px}
#clearSearch{position:absolute;right:6px;background:none;border:0;color:var(--fg3);font-size:15px;padding:2px 6px;border-radius:50%}
#clearSearch:hover{color:var(--fg);background:#ffffff12}
.tbtools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tbtn{
  background:#1b2530;border:1px solid var(--line2);border-radius:6px;padding:5px 10px;
  color:var(--fg2);transition:.15s;white-space:nowrap
}
.tbtn:hover{border-color:var(--accent);color:var(--fg)}
.tbtn.on{background:#12352b;border-color:var(--accent);color:var(--accent)}
select.tbtn{padding:5px 6px}
.slider{display:flex;align-items:center;gap:6px;background:#1b2530;border:1px solid var(--line2);border-radius:6px;padding:3px 9px}
.slider input[type=range]{width:86px;accent-color:var(--accent)}
.slider label{color:var(--fg3);font-size:11px;white-space:nowrap}

/* ---------- tabs ---------- */
#tabs{display:flex;gap:2px;padding:0 14px;background:#131b23;border-bottom:1px solid var(--line);flex:0 0 auto;overflow-x:auto}
#tabs button{
  background:none;border:0;border-bottom:2px solid transparent;padding:8px 14px;color:var(--fg3);
  font-size:13px;white-space:nowrap;transition:.15s
}
#tabs button:hover{color:var(--fg2)}
#tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}

/* ---------- layout ---------- */
#main{display:flex;flex:1 1 auto;min-height:0}
#sidebar{
  width:212px;flex:0 0 auto;background:#121a22;border-right:1px solid var(--line);
  overflow-y:auto;padding:8px 0 24px
}
.catgroup{padding:9px 14px 4px;color:var(--fg3);font-size:10.5px;letter-spacing:1px;text-transform:uppercase}
.cat{
  display:flex;align-items:center;gap:8px;padding:6px 12px 6px 14px;cursor:pointer;
  border-left:3px solid transparent;color:var(--fg2);transition:.12s;user-select:none
}
.cat:hover{background:#1a242e;color:var(--fg)}
.cat.on{background:#16232c;border-left-color:var(--accent);color:var(--accent);font-weight:600}
.cat .cnt{margin-left:auto;color:var(--fg3);font-size:11px;font-variant-numeric:tabular-nums}
.cat.on .cnt{color:var(--accent)}
.cat .k{font-size:14px;width:18px;text-align:center;opacity:.85}

#content{flex:1 1 auto;min-width:0;overflow-y:auto;padding:12px 14px 80px}
#detail{
  width:400px;flex:0 0 auto;background:#111922;border-left:1px solid var(--line);
  overflow-y:auto;padding:0 0 40px;position:relative
}
#detail.empty{display:flex;align-items:center;justify-content:center;color:var(--fg3);text-align:center;padding:40px}

/* ---------- list header ---------- */
.listhead{display:flex;align-items:center;gap:10px;margin:2px 0 12px;flex-wrap:wrap}
.listhead h2{margin:0;font-size:15px;font-weight:600}
.listhead .sub{color:var(--fg3);font-size:12px}
.listhead .spacer{flex:1}
.chip{
  display:inline-flex;align-items:center;gap:5px;background:#1b2530;border:1px solid var(--line2);
  border-radius:14px;padding:2px 10px;font-size:11.5px;color:var(--fg2)
}
.chip b{color:var(--fg)}

/* ---------- grid ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.grid.small{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.grid.large{grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px}
.cell{
  background:linear-gradient(180deg,#18222c,#141c25);border:1px solid var(--line);border-radius:var(--radius);
  padding:8px 8px 7px;text-align:center;cursor:pointer;transition:.14s;position:relative;overflow:hidden
}
.cell:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 6px 18px #0007}
.cell.on{border-color:var(--accent);background:#16262a}
.cell canvas{display:block;margin:0 auto;image-rendering:pixelated;filter:drop-shadow(0 3px 5px #0008)}
.cell .nm{margin-top:7px;font-size:12px;color:var(--fg);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .meta{font-size:10.5px;color:var(--fg3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .badge{
  position:absolute;top:5px;left:5px;font-size:9.5px;padding:1px 6px;border-radius:9px;
  background:#0d1319cc;border:1px solid var(--line2);color:var(--fg3)
}
.cell .eyebrow{
  position:absolute;top:5px;right:5px;font-size:9.5px;padding:1px 6px;border-radius:9px;
  background:#0d1319cc;border:1px solid var(--line2)
}

/* ---------- detail panel ---------- */
.dhead{padding:14px 16px 10px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#18232d,#131b23);position:sticky;top:0;z-index:5}
.dhead .row1{display:flex;gap:14px;align-items:flex-start}
.dhead canvas{image-rendering:pixelated;filter:drop-shadow(0 6px 14px #000a);flex:0 0 auto}
.dhead h3{margin:0 0 4px;font-size:16px;line-height:1.25}
.dhead .id{font-family:var(--mono);font-size:11px;color:var(--fg3);word-break:break-all}
.dhead .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.tag{font-size:10.5px;padding:1px 8px;border-radius:10px;border:1px solid var(--line2);background:#0f161d;color:var(--fg2)}
.sect{padding:12px 16px;border-bottom:1px solid #1c2731}
.sect h4{margin:0 0 8px;font-size:11px;letter-spacing:1.1px;text-transform:uppercase;color:var(--fg3)}
.desc{font-size:13.5px;line-height:1.62}
.desc .ln{display:block}
.desc .x{font-weight:700}
.desc .ph{color:var(--fg3);font-style:italic}
.names{display:flex;flex-direction:column;gap:3px;font-size:12.5px}
.names .n{display:flex;gap:8px}
.names .n i{font-style:normal;color:var(--fg3);width:62px;flex:0 0 auto;font-size:11px}
table.kv{width:100%;border-collapse:collapse;font-size:12px}
table.kv td{padding:3px 0;vertical-align:top}
table.kv td:first-child{color:var(--fg3);width:104px;padding-right:8px;font-size:11.5px}
table.kv td:last-child{font-family:var(--mono);font-size:11.5px;word-break:break-word}
.mono{font-family:var(--mono);font-size:11.5px}
.cfgbox{background:#0c1218;border:1px solid var(--line);border-radius:6px;padding:8px;font-family:var(--mono);font-size:11px;white-space:pre-wrap;word-break:break-word;max-height:230px;overflow:auto;color:#9fd3bb}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btn{
  background:#1b2530;border:1px solid var(--line2);border-radius:6px;padding:5px 10px;font-size:11.5px;color:var(--fg2);transition:.14s
}
.btn:hover{border-color:var(--accent);color:var(--fg);background:#1d2b34}
.btn.primary{background:#12352b;border-color:var(--accent);color:var(--accent)}
.btn.primary:hover{background:#17453a}
.hint{color:var(--fg3);font-size:11px;margin-top:6px;line-height:1.5}

/* ---------- forge ---------- */
.forge{display:grid;grid-template-columns:320px 1fr;gap:18px;align-items:start}
.forge .preview{position:sticky;top:0;text-align:center;background:#131c24;border:1px solid var(--line);border-radius:10px;padding:14px 12px}
.forge .preview canvas{image-rendering:pixelated;filter:drop-shadow(0 12px 26px #000b)}
.forge .opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:14px;align-content:start}
.opt{background:#141d26;border:1px solid var(--line);border-radius:8px;padding:0;overflow:hidden}
.opt h4{
  display:flex;align-items:center;gap:8px;margin:0;padding:9px 11px;cursor:pointer;user-select:none;
  font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--fg3);background:#18222c
}
.opt h4:hover{color:var(--fg2)}
.opt h4 .ocur{
  margin-left:auto;max-width:52%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:11px;letter-spacing:0;text-transform:none;color:var(--accent)
}
.opt h4 .chev{color:var(--fg3);transition:transform .15s;font-size:10px}
.opt.collapsed h4 .chev{transform:rotate(-90deg)}
.opt .obody{padding:10px 11px 11px}
.opt.collapsed .obody{display:none}
/* the subject picker is the only group with hundreds of entries: scroll it in place */
#content .opt[data-gkey="base"] .chips{max-height:min(48vh,360px);overflow:auto;overscroll-behavior:contain;padding-right:2px}
.pick .pickmod{
  font-size:8.5px;font-style:normal;letter-spacing:.4px;padding:0 4px;border-radius:7px;margin-left:2px;
  background:#2b2140;border:1px solid var(--purple);color:#cbb8ee
}
/* jump bar */
.forgenav{
  grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;
  position:sticky;top:0;z-index:6;padding:6px 0 8px;
  background:linear-gradient(180deg,var(--bg) 72%,transparent)
}
.forgenav .nv{
  padding:4px 10px;font-size:11.5px;border-radius:99px;border:1px solid var(--line2);
  background:#141c25;color:var(--fg3);transition:.12s
}
.forgenav .nv:hover{border-color:var(--accent);color:var(--fg)}
.forgenav .nv.on{border-color:var(--accent);color:var(--accent);background:#12352b}
.forgenav .nv.act{border-style:dashed}
.forgenav .nvsep{flex:1;min-width:4px}
/* one-line current combination under the preview */
.pvnow{
  margin-top:9px;font-size:11.5px;color:var(--fg2);line-height:1.5;text-align:center;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden
}
.pvsummary table{width:100%}
/* the codex source chip */
.tbtn.srcchip{border-color:var(--accent);color:var(--accent);background:#12352b}
.tbtn.srcchip .x{opacity:.7;margin-left:2px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.pick{
  display:flex;align-items:center;gap:6px;background:#18232d;border:1px solid var(--line2);border-radius:6px;
  padding:3px 8px 3px 3px;font-size:11.5px;color:var(--fg2);transition:.12s
}
.pick:hover{border-color:var(--accent);color:var(--fg)}
.pick.on{border-color:var(--accent);background:#12352b;color:var(--accent)}
.pick canvas{image-rendering:pixelated;display:block}
.pick.nosprite{padding:3px 8px}

/* ---------- atlas ---------- */
.atarow{background:#131c24;border:1px solid var(--line);border-radius:8px;margin-bottom:10px;overflow:hidden}
.atahead{display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;user-select:none}
.atahead:hover{background:#18232d}
.atahead .fn{font-family:var(--mono);font-size:12px}
.atahead .dim{color:var(--fg3);font-size:11px}
.atahead .spacer{flex:1}
.atabody{padding:10px;border-top:1px solid var(--line);overflow:auto;max-height:70vh}
.atabody .wrap{position:relative;display:inline-block;background:
  repeating-conic-gradient(#1a242e 0% 25%,#141d26 0% 50%) 50%/16px 16px;border:1px solid var(--line2)}
.atabody img{display:block;image-rendering:pixelated}
.atabody .gridov{position:absolute;inset:0;pointer-events:none}
.atabody .gridov i{position:absolute;outline:1px solid #4bc29255}
.tileinfo{font-family:var(--mono);font-size:11.5px;color:var(--accent);margin-top:6px;min-height:16px}

/* ---------- tables ---------- */
table.data{width:100%;border-collapse:collapse;font-size:12px}
table.data th{
  position:sticky;top:0;background:#18222c;text-align:left;padding:7px 9px;border-bottom:1px solid var(--line2);
  color:var(--fg3);font-weight:600;font-size:11px;letter-spacing:.4px;cursor:pointer;white-space:nowrap;z-index:2
}
table.data th:hover{color:var(--fg)}
table.data td{padding:5px 9px;border-bottom:1px solid #1b2530;vertical-align:middle}
table.data tbody tr:hover{background:#18222d}
table.data tbody tr{cursor:pointer}
table.data td.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:11.5px}
table.data td.id{font-family:var(--mono);font-size:11.5px;color:var(--fg2)}

/* ---------- 得分计算器（牌桌式） ---------- */
.scboard{display:flex;flex-direction:column;gap:10px}
.scbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.scbar select,.scbar input{font:inherit;font-size:12.5px;color:var(--fg);background:#131c24;border:1px solid var(--line);border-radius:6px;padding:4px 7px;min-height:30px}
.scbar label.sclvl{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--fg2)}
.scbar label.sclvl input{width:62px}
.scbase{font-size:11.5px;color:var(--fg3);font-family:var(--mono)}
.scrailbox{background:linear-gradient(180deg,#16202a,#111a22);border:1px solid var(--line);border-radius:12px;padding:8px 12px 12px}
.scraillabel{font-size:11.5px;color:var(--fg3);letter-spacing:1px;margin-bottom:6px}
.scraillabel em{font-style:normal;color:#4a5a68;margin-left:6px}
.scrail{display:flex;flex-wrap:wrap;align-items:flex-end;min-height:64px;gap:0}
.scrail .scempty{font-size:12px;color:var(--fg3);padding:16px 2px}
/* 卡位：真实卡图，互相压一点，像游戏里那样摆 */
.sctile{position:relative;cursor:pointer;border-radius:7px;transition:transform .12s,box-shadow .12s,filter .12s;line-height:0;margin-right:-14px}
.sctile:last-child{margin-right:0}
.sctile canvas{width:71px;height:95px;display:block;border-radius:7px;box-shadow:0 3px 10px #0008}
.scrail .scj canvas{width:64px;height:86px}
.sctile:hover{transform:translateY(-8px);z-index:200 !important}
.sctile.on{transform:translateY(-10px);box-shadow:0 0 0 2px var(--accent),0 8px 22px #000a}
.sctile.todo{filter:grayscale(.75) brightness(.7)}
.sctile .scbadge{position:absolute;left:0;right:0;bottom:-1px;font-size:9.5px;line-height:1.5;text-align:center;color:var(--fg2);
  background:#0d1319cc;border-radius:0 0 7px 7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px;font-style:normal}
.sctile .scred{position:absolute;top:2px;right:2px;background:#fe5f55;color:#26090a;font-size:9.5px;border-radius:5px;padding:0 3px;font-style:normal}
.sctile .scmv{position:absolute;top:-9px;left:50%;transform:translateX(-50%);display:none;gap:2px;z-index:210}
.sctile:hover .scmv{display:flex}
.sctile .scmv button{font-size:9px;line-height:1;padding:2px 4px;border-radius:4px;border:1px solid var(--line2);background:#131c24;color:var(--fg2);cursor:pointer}
/* 游戏同款的筹码 × 倍率 */
.scmath{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap}
.scchips,.scmult,.sctotal{flex:1 1 150px;border-radius:12px;padding:8px 14px;display:flex;flex-direction:column;gap:1px;min-width:0}
.scchips{background:linear-gradient(180deg,#123a5c,#0e2740);border:1px solid #2f6f9e}
.scmult{background:linear-gradient(180deg,#5c1b1b,#3a1010);border:1px solid #9e4040}
.sctotal{background:linear-gradient(180deg,#123a2c,#0e2a20);border:1px solid #2f9e6f}
.scchips span,.scmult span,.sctotal span{font-size:11px;letter-spacing:2px;color:#ffffff9c}
.scchips b,.scmult b,.sctotal b{font-family:var(--mono);font-size:30px;line-height:1.1;color:#fff}
.sctotal b{color:var(--accent)}
.scx,.sceq{display:grid;place-items:center;font-size:22px;color:var(--fg3);padding:0 2px}
.scplay{display:flex;align-items:center;gap:7px;flex-wrap:wrap;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.scplay input[type=range]{flex:1 1 160px;min-width:120px}
.scstepn{font-size:11.5px;color:var(--fg3);font-family:var(--mono)}
.scnow{font-size:12px;color:var(--accent);flex:1 1 100%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scpickers{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.scpkh{flex:1 1 100%;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--fg)}
.scpkrow{flex:1 1 100%;display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.scpkrow>span{font-size:12px;color:var(--fg3);min-width:34px}
.scpk{font:inherit;font-size:11.5px;color:var(--fg2);background:#131c24;border:1px solid var(--line);border-radius:6px;padding:4px 9px;min-height:28px;cursor:pointer}
.scpk:hover{border-color:var(--line2);color:var(--fg)}
.scpk.on{color:var(--accent);border-color:var(--accent);background:#12352b}
.scpickers input{font:inherit;font-size:12.5px;color:var(--fg);background:#131c24;border:1px solid var(--line);border-radius:6px;padding:5px 8px;min-height:30px;flex:0 1 220px}
.scjres{flex:1 1 100%;display:flex;gap:6px;flex-wrap:wrap}
.scjres .btn{font-size:11.5px;padding:4px 9px;min-height:28px}
.sclog{border:1px solid var(--line);border-radius:10px;background:#0d1319;overflow:hidden}
.sclog summary{cursor:pointer;padding:8px 12px;font-size:12.5px;color:var(--fg2);list-style:none}
.sclog summary::-webkit-details-marker{display:none}
.sclog summary::before{content:'▸ ';color:var(--fg3)}
.sclog[open] summary::before{content:'▾ '}

/* Start screen for the web build. Uses the same palette as the viewer.
   ── 布局要点（踩过坑，别改回去）─────────────────────────────────────────
   #boot 是 fixed 满屏的滚动容器。**不能用 align-items:center**：卡片比屏幕高时，
   flex 的居中会把卡片顶部顶到视口上方，而溢出的那部分滚不上去 —— 表现就是
   "导入按钮被卡在屏幕外面，怎么也滚不到"。正确做法是 align-items:flex-start +
   卡片 margin:auto：有富余空间时 auto 外边距自然居中，没有富余时它退化成 0，
   卡片顶部永远留在 padding 边缘、可滚动可达。 */
#boot{
  position:fixed;inset:0;z-index:120;overflow:auto;
  display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;
  background:
    radial-gradient(1100px 520px at 12% -10%, #1d3040 0%, transparent 60%),
    radial-gradient(900px 480px at 100% 0%, #241c33 0%, transparent 55%),
    var(--bg,#10161c);
  color:var(--fg,#dfe7ee);font-family:var(--sans,"Segoe UI","PingFang SC",system-ui,sans-serif)
}
.bootcard{
  width:100%;max-width:620px;margin:auto;background:linear-gradient(180deg,#18222c,#141c25);
  border:1px solid var(--line,#26313d);border-radius:14px;padding:26px 26px 22px;box-shadow:0 20px 60px #000a
}
.bootcard h1{margin:0 0 12px;font-size:21px;letter-spacing:.5px}
.bootcard .lead{margin:0 0 10px;font-size:13px;line-height:1.75;color:var(--fg3,#6d7d8d)}
.bootcard .lead.strong{color:var(--fg2,#9fb0c0)}
/* 宽屏：左右分栏 —— 左边导入（主操作），右边预览（能干什么）。
   DOM 顺序是「导入在前」，所以窄屏单列时导入自然排在预览上面。 */
.bootcols{display:block}
.bootimp>*:first-child{margin-top:0}
@media(min-width:920px){
  .bootcard{max-width:1020px}
  .bootcols{display:grid;grid-template-columns:minmax(300px,360px) 1fr;gap:26px;align-items:start}
}
.bootbtns{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 10px}
.bootbtns .btn{font-size:13.5px;padding:9px 16px}
/* 免责 / 说明：紧跟在按钮下面，回答"为什么还要我自己选文件" */
.bootdisc{
  margin:0 0 16px;padding:10px 12px;border-left:3px solid var(--line2,#33414f);
  background:#131c24;border-radius:0 8px 8px 0;
  color:var(--fg3,#6d7d8d);font-size:12.5px;line-height:1.8
}
/* "已载入上次解析的素材"提示条（素材存在访客自己的 IndexedDB 里） */
.bootcache{
  position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:130;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;
  max-width:min(680px,calc(100vw - 24px));
  background:#18222cf2;border:1px solid var(--line,#26313d);border-radius:12px;
  padding:10px 14px;box-shadow:0 12px 34px #000a;color:var(--fg2,#9fb0c0);font-size:12.5px
}
.bootcachetext{display:flex;flex-direction:column;gap:2px;min-width:0}
.bootcachetext b{color:var(--fg,#dfe7ee);font-size:13px}
.bootcachetext span{color:var(--fg3,#6d7d8d)}
.bootcacheacts{display:flex;gap:8px;flex-wrap:wrap}
.bootcacheacts .btn{font-size:12.5px;padding:7px 12px}
.bootdrop{
  border:1.5px dashed var(--line2,#33414f);border-radius:12px;padding:18px 16px;text-align:center;
  color:var(--fg3,#6d7d8d);font-size:12.5px;transition:.15s;background:#131c24
}
.bootdrop.over{border-color:var(--accent,#4bc292);background:#152a29;color:var(--accent,#4bc292)}
.bootdrop .big{font-size:22px;line-height:1;margin-bottom:8px;color:var(--accent,#4bc292);opacity:.9}
/* 触屏上没有拖放这回事，所以手机显示 .boottap，桌面才显示 .bootdrop */
.boottap{display:none}
.bootnotes{margin:16px 0 0;padding-left:18px;font-size:12px;line-height:1.85;color:var(--fg3,#6d7d8d)}

.bootbar{height:5px;border-radius:99px;background:#0d1319;margin-top:8px;overflow:hidden}
.bootfill{height:100%;background:linear-gradient(90deg,#4bc292,#009dff);transition:width .25s}
@media (hover:none){

  .boottap{

  }

/* ---------------------------------------------------------------------------
   「它能做什么」预览区 —— 属于这个工具自己，所以放在启动页（点进来第一眼看到的就是它），
   而不是工具箱首页：首页以后还要放别的项目。
   所有选择器都限定在 .bootdemo 里，免得跟查看器自己的 .dhead 等类名打架。
   内容全部由代码绘制，不含任何游戏素材。
