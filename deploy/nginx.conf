# ============================================================================
#  Balatro 素材图鉴 —— nginx 配置（纯静态站）
#
#  用法：
#    sudo cp deploy/nginx.conf /etc/nginx/conf.d/balatro.conf
#    改掉下面两行：server_name / root
#    sudo nginx -t && sudo systemctl reload nginx
#    sudo certbot --nginx -d 你的域名          # 免费 HTTPS，自动续期
#
#  说明：站点是纯静态的，没有后端、没有 API、不需要 rewrite 规则。
#        页面里的资源全部是相对路径，所以放在子目录（location /balatro/）
#        下也能正常工作，本文给的是「独立域名 / 根目录」的写法。
# ============================================================================

server {
    listen      80;
    listen      [::]:80;
    server_name balatro.example.com;          # ← 改成你的域名

    root  /var/www/balatro;                   # ← 改成你上传 dist/lite 的目录
    index index.html;

    charset utf-8;

    # ---- 压缩：代码都是文本，压完只有几十 KB ---------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json
                      application/manifest+json image/svg+xml application/xml;

    # 有 brotli 模块的话可以一并开启（可选）
    # brotli            on;
    # brotli_comp_level 5;
    # brotli_types      text/plain text/css application/javascript application/json
    #                   application/manifest+json image/svg+xml application/xml;

    # ---- 缓存策略 -------------------------------------------------------------
    # HTML 必须回源校验：重新构建后要立刻生效
    location = /index.html {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location = /sw.js {
        # Service Worker 由浏览器自己管缓存，这里不要再叠一层长时间缓存
        add_header Cache-Control "no-cache";
    }

    # 两个大文件（仅 dist/web 自带素材的版本才有）几乎不变，可以长缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ---- 安全响应头（纯静态站，拿掉用不到的能力） ----------------------------
    add_header X-Content-Type-Options   "nosniff"        always;
    add_header X-Frame-Options          "SAMEORIGIN"     always;
    add_header Referrer-Policy          "no-referrer-when-downgrade" always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;
    # 页面不加载任何外部资源（已用 check-offline.js 审计过），所以可以收紧 CSP。
    # 注意：blob: 与 data: 是必需的 —— 访客的游戏贴图在页面里是 blob: URL。
    add_header Content-Security-Policy  "default-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; worker-src 'self' blob:; base-uri 'none'; form-action 'none'" always;

    # ---- 站点本体 -------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 404 用站点自己的页面
    error_page 404 /404.html;

    # og.png / icon.svg 等静态文件按扩展名给正确类型即可，nginx 自带 mime.types 已覆盖

    # 日志（可选，默认位置就行）
    # access_log /var/log/nginx/balatro.access.log;
    # error_log  /var/log/nginx/balatro.error.log;
}

# ============================================================================
#  HTTPS 部分交给 certbot 自动生成（会在这个文件里追加一个 443 server 块并
#  自动续期）。也可以自己写：
#
#  server {
#      listen 443 ssl http2;
#      server_name balatro.example.com;
#      ssl_certificate     /etc/letsencrypt/live/balatro.example.com/fullchain.pem;
#      ssl_certificate_key /etc/letsencrypt/live/balatro.example.com/privkey.pem;
#      root /var/www/balatro;
#      # …上面的 location / 缓存 / 安全头照抄…
#  }
#  server {
#      listen 80;
#      server_name balatro.example.com;
#      return 301 https://$host$request_uri;
#  }
# ============================================================================
